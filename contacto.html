<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Cecilia Diaz</title>
    <link rel="icon" type="image/jpeg" href="img/foto/1.JPG">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      /* Cambia el color primario de Bootstrap (celeste) a gris */
      .btn-primary {
        background-color: #6c757d !important;
        border-color: #6c757d !important;
      }
      .btn-primary:hover, .btn-primary:focus {
        background-color: #5a6268 !important;
        border-color: #545b62 !important;
      }
    </style>
</head>
<body>
   <div id="carouselExampleDark" class="carousel carousel-dark slide" data-bs-ride="carousel">
     <div class="carousel-indicators" style="bottom: -10px;">
        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
     <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="1000">
             <img src="img/2.jpg" class="carousel-img" alt="servicios">
             <div class="carousel-caption">
             <h5>Conocé nuestros servicios</h5>
             <button class="btn btn-primary mt-3" onclick="document.getElementById('servicios').scrollIntoView({behavior: 'smooth'});">
                 Ver servicios
               </button>
             </div>
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="img/66.png" class="carousel-img" alt="quienes somos">
          <div class="carousel-caption">
             <h5>Conocé más sobre nosotros</h5>
             <p>Detalle de experiencia, estudios y más.</p>
            <a class="btn btn-primary mt-3" href="about.html">Sobre mi</a>
           </div>
          </div>
        <div class="carousel-item" data-bs-interval="2000">
              <img src="img/3.jpg" class="carousel-img" alt="contacto">
            <div class="carousel-caption">
                 <h5>Contactanos</h5>
                 <p>Contanos de tu proyecto y recibi un presupuesto personalizado.</p>
                <a class="btn btn-primary mt-3" href="contacto.html">Contacto</a>
              </div>
          </div>
   </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
  <div class="container mt-5">
    <header class="mb-4">
      <h2 class="text-center">Contacto</h2>
    </header>

    <form class="border rounded p-4 shadow-sm bg-light">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" name="nombre" class="form-control">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico:</label>
        <input type="email" id="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" class="form-control" rows="4"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </form>

    <!--<div class="text-center mt-3">
      <a href="index.html" class="btn btn-link">Volver al inicio</a>
    </div>-->

    <footer class="text-center mt-5">
      <p>© 2025 Cecilia Díaz. Todos los derechos reservados.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
